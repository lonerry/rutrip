spring:
  application:
    name: map
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/mapdb}
    username: ${SPRING_DATASOURCE_USERNAME:map}
    password: ${SPRING_DATASOURCE_PASSWORD:map}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 250MB
    max-http-form-post-size: 250MB
    connection-timeout: 120s

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-256-bit-secret-key!!}
    expiration-ms: 86400000
  upload:
    dir: ${UPLOAD_DIR:uploads}
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:Rutrip <noreply@localhost>}
  geo:
    yandex-key: ${YANDEX_MAPS_KEY:${VITE_YANDEX_MAPS_KEY:}}
    mapbox-token: ${MAPBOX_TOKEN:${VITE_MAPBOX_TOKEN:}}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
