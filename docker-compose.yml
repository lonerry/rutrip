services:
  postgres:
    image: postgres:16
    container_name: map-postgres
    environment:
      POSTGRES_DB: mapdb
      POSTGRES_USER: map
      POSTGRES_PASSWORD: map
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U map -d mapdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: map-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
